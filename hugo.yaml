baseURL: https://jedixl.github.io/site/
locale: zh-cn
defaultContentLanguage: zh
title: 浓雾荒原
theme:
  - PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false

pagination:
  pagerSize: 10

caches:
  images:
    dir: ":cacheDir/images"

minify:
  disableXML: true

params:
  env: production
  description: 个人博客
  author: JediXL
  defaultTheme: auto
  assets:
    favicon: favicon.png
    favicon16x16: favicon.png
    favicon32x32: favicon.png
    apple_touch_icon: favicon.png
    safari_pinned_tab: favicon.png
  label:
    icon: logo.png
    iconHeight: 32
  mainSections:
    - posts
  DateFormat: "2006年1月2日"
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true

  homeInfoParams:
    Title: 🔥 我是Jedi，欢迎来到我的荒原
    Content: "“荒野是一门语言，需要学习才能懂得。  \n这里没有苦痛，没有空虚无聊，无须纠缠过去，也不必惧怕未来”"

menu:
  main:
    - name: 首页
      url: /
      weight: 5
    - name: 文章
      url: /posts/
      weight: 10
    - name: 归档
      url: /archives/
      weight: 20
    - name: 关于
      url: /about/
      weight: 40
    - name: RSS订阅
      url: /index.xml
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON
